defaults:
  - default_config

ExperimentConfig:
  initial_BC: false
  BC_finetuning: true
  ppo: false
  evaluate: false
  selfplay: false
  league_training: false

  model_path: BC_coacAI
  BC_model_path:
  exp_name: BC_coacAI_collect_finetuning
  wandb_project_name: Ranged_focus

  resume: false
  prod_mode: false
  seed: 1
  render: true
  render_all: false

  # Collect only; BC loop starts at epoch 1, so epochs=1 skips training.
  newdata: true
  epochs: 1
  start_epoch: 1
  warmup_epochs: 1
  nurwins: true

  # Same replay collection target as bc_coacAI_collect.yaml.
  bc_expert_ai: coacAI
  bc_opponent_ais:
    - workerRushAI
    - lightRushAI
    - mayari
    - coacAI
  bc_num_runs: 2000

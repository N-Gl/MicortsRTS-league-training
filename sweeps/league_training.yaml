name: league_training_sweep
program: main.py
method: bayes
metric:
  name: main_winrates/combined_selfplay_no_draw_plus_bot_with_draw_0
  goal: maximize
parameters:
  ExperimentConfig.total_timesteps:
    value: 6000000
  ExperimentConfig.wandb_group_name:
    value: sweep_league_training
  ExperimentConfig.wandb_project_name:
    value: league-training-sweep
  ExperimentConfig.exp_name:
    value: sweep_lr_${ExperimentConfig.PPO_learning_rate}_ent_${ExperimentConfig.ent_coef}_clip_${ExperimentConfig.clip_coef}_vf_${ExperimentConfig.vf_coef}_kl_${ExperimentConfig.kl_coeff}
  ExperimentConfig.PPO_learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-4
  ExperimentConfig.ent_coef:
    distribution: log_uniform_values
    min: 0.001
    max: 0.02
  ExperimentConfig.clip_coef:
    distribution: log_uniform_values
    min: 0.05
    max: 0.3
  ExperimentConfig.vf_coef:
    distribution: log_uniform_values
    min: 0.01
    max: 0.5
  ExperimentConfig.kl_coeff:
    distribution: log_uniform_values
    min: 0.1
    max: 0.6
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config-name
  - league_sp_conf_old_ppo_args_3
  - ${args_no_hyphens}

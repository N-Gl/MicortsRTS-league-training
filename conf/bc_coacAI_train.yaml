defaults:
  - default_config

ExperimentConfig:
  initial_BC: true
  BC_finetuning: false
  ppo: false
  evaluate: false
  selfplay: false
  league_training: false

  model_path: models/BC_coacAI_train/initial_BC/BC_coacAI_train_epoch_3/agent.pt
  BC_model_path:
  exp_name: BC_coacAI_train
  wandb_project_name: Ranged_focus

  resume: true
  prod_mode: false
  seed: 462
  render: false
  render_all: false

  # Train on already collected replays in replays/initial.
  newdata: false
  epochs: 8
  start_epoch: 4
  warmup_epochs: 5
  nurwins: false


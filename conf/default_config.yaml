ExperimentConfig:
  model_path:
  cur_main_path:
  cur_main_exploiter_path:
  BC_model_path:        # BC_model_path == model_path, falls BC_model_path None ist
  wandb_project_name: test_basic
  exp_name:
  gym_id: MicrortsBC
  other_historicals_paths:

  initial_BC: false
  BC_finetuning: false
  ppo: false
  evaluate: false
  selfplay_evaluate_testing: false
  selfplay: false

  pfsp: false
  league_training: false

  resume: true

  BC_learning_rate: 1e-6
  BC_weight_decay: 0.0
  PPO_learning_rate: 2.5e-5     # new (BA Parameter) (learning rate = 2.5 × 10^−5)
  exploiter_PPO_learning_rate:
  PPO_weight_decay: 0.0

  torch_deterministic: true
  deterministic: true
  seed:                        # if None -> seed = time.time()
  exact_seed: true
  dbg_deterministic_actions: false
  dbg_exploiter_update: false
  dbg_seed: false
  dbg_non_legal_action: false
  starting_historical: true

  total_timesteps: 30000000     # new (BA Parameter) (Training was run for 30 million steps)

  cuda: true

  prod_mode: true
  render: true
  render_all: false
  capture_video: false

  wandb_entity:
  wandb_group_name:
  create_run_id_file: false

  n_minibatch: 4
  num_bot_envs: 0              # new (BA Parameter) (number of parallel game environments = 24)
  max_num_bot_envs: 0
  num_selfplay_envs: 0

  num_envs: 0
  num_main_envs: 0
  num_main_exploiters: 0
  num_league_exploiters: 0
  num_envs_per_main_exploiters: 1
  num_envs_per_league_exploiters: 1
  lower_selfplay_winrate_offset:
  upper_selfplay_winrate_offset:
  num_bot_envs_per_main_exploiter: 0

  selfplay_save_interval: 10
  main_selfplay_save_interval: 10
  main_exploiter_selfplay_save_interval: 10
  league_exploiter_selfplay_save_interval: 10
  checkpoint_frequency: 10

  new_hist_rewards: 0

  attack_reward_weight: 0.05    # new (BA Parameter) 0.05
  dyn_attack_reward: 0.0                # subtract from reward when a game ends in a draw (selfplay training)
  value_warmup_updates: 0        # number of initial PPO updates with value-only training
  rewardscore: 0.0

  endgame_maps: false

  num_steps: 512                # new (BA Parameter) (Rollout steps per environment = 512)
  gamma: 1.0                    # new (BA Parameter) Discount factor γ = 1 (no discounting)
  gae_lambda: 0.95              # new (BA Parameter) (GAE parameter λ = 0.95)
  ent_coef: 0.005               # new (BA Parameter) (Entropy coefficient η = 0.005)
  exploiter_ent_coef: ${ExperimentConfig.ent_coef}  # separate entropy bonus for exploiters (defaults to main ent_coef)
  vf_coef: 0.01                 # new (BA Parameter) (Value function coefficient β = 0.01)
  max_grad_norm: 0.5            # new (BA Parameter) (Gradient norm threshold ω = 0.5)
  clip_coef: 0.1                # new (BA Parameter) (Clipping coefficient = 0.1)
  update_epochs: 4              
  kle_stop: false               
  kle_rollback: false           
  target_kl: 0.03               
  kl_coeff: 0.4                 # new (BA Parameter) (KL regularization coefficient λ_(KL) = 0.4)
  norm_adv: true                
  anneal_lr: true               
  clip_vloss: true 

  epochs: 30                   # new (BA Parameter) 100 Epochen, BC-finetuning 70 Epochen
  warmup_epochs: 20            # new (BA Parameter) (Over 30 epochs, α linearly decreases to zero) (changed: 20)
  newdata: false                
  nurwins: false                

  save_gpu_memory: false
  dbg_no_main_agent_ppo_update: false
  Bot_as_player_1: true

  num_eval_episodes: 100
  num_parallel_eval_games: 0


  main_winrate_threshold: 0.7 # also used as threashold for choosing historical opponents in _verification_branch
  main_exploiter_winrate_threshold: 0.7
  league_exploiter_winrate_threshold: 0.7
  main_exploiter_vs_main_winrate_threshold: 0.4
  checkpoint_end_buffer_steps: 0
  main_exploiter_no_draw_winrate_threshold: 0.1  # in Article: 0.2
  pfsp_min_prob_factor: 0.25

  main_PFSP_prob: 0.7  # in Article: 0.5
  main_SP_prob: 0.1  # in Article: 0.35
  main_pfsp_weighting:       # pfsp in _selfplay_branch not included in Article: "squared"
  main_exploiter_pfsp_weighting: variance  # in Article: "variance"
  league_exploiter_pfsp_weighting: variance  # in Article: "variance"

  unit_exploiters: false
  Unit_reward_per_exploiter: false    # if true, each exploiter gets its own unit type bonus reward till it resets


  unit_bonus_max_worker: 1.0
  unit_bonus_max_light: 1.0
  unit_bonus_max_heavy: 1.0
  unit_bonus_max_ranged: 1.0
hydra:
  job:
    chdir: false
